name: Cron — Daily Tasks

# Same secrets as cron-usage.yml — CRON_SECRET and APP_URL.
# Runs once a day at 08:00 UTC — adjust the cron expression if you want a
# different time (e.g. to land the summary email at your morning in Nairobi,
# which is UTC+3, so 05:00 UTC ≈ 08:00 EAT).
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

jobs:
  bandwidth-alerts:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/alerts" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"

  daily-summary:
    runs-on: ubuntu-latest
    needs: bandwidth-alerts
    steps:
      - run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/summary" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"

  cleanup-stale-orders:
    runs-on: ubuntu-latest
    needs: daily-summary
    steps:
      - run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/cleanup" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"
