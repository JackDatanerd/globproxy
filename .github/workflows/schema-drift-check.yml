name: Schema drift check

# Fails the build if supabase/schema.sql is out of sync with
# supabase/migrations/ — see scripts/check-schema-sync.mjs for the
# comparison logic and why this exists (schema.sql has drifted from
# migrations before, silently reopening a fixed RLS gap).
#
# Runs on pull_request too, not just push to main, so drift is caught
# before merge — a manual `wrangler deploy` or a merge without CI
# shouldn't be the only way this ever gets checked.
#
# Must live at .github/workflows/ at the repo root, not inside gp/ —
# same as deploy.yml and the cron workflows.

on:
  push:
    branches: [main]
    paths:
      - 'gp/supabase/**'
      - 'gp/scripts/check-schema-sync.mjs'
  pull_request:
    paths:
      - 'gp/supabase/**'
      - 'gp/scripts/check-schema-sync.mjs'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check schema.sql is in sync with migrations
        run: node scripts/check-schema-sync.mjs
