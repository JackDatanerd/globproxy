name: CI

# Pull requests used to get exactly one automated check (schema drift, and only when
# supabase/ changed). Everything else — types, cron wiring — was first exercised by
# the production deploy. This runs the cheap, deterministic checks on every PR and on
# demand; deploy.yml still runs them again before shipping.
#
# Must live at .github/workflows/ at the repo root, not inside gp/.

on:
  pull_request:
    paths:
      - 'gp/**'
      - '.github/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gp/package-lock.json
      - run: npm ci
      # One command, the same one the pre-push hook and deploy.yml run: schema.sql roll-up,
      # cron / rate-limit wiring, API docs, supplier-name ratchet, unit tests, TypeScript.
      - name: Checks (schema, cron wiring, API docs, supplier ratchet, tests, types)
        run: npm run check
