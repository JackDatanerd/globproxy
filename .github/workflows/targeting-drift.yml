name: Targeting data drift

# The country / state / city / ISP pickers (gp/public/geo, gp/lib/geo, gp/lib/locations) are
# generated from the upstream supplier's targeting export, which drifts over time. Nothing
# noticed: the scripts only ran when someone remembered to pull the export by hand. Weekly,
# this pulls it, regenerates, and FAILS (so GitHub e-mails the repo owner) when the
# generated files differ from what is committed. It never commits anything itself.
#
# Needs two repository secrets; without them the run is a no-op (not a failure):
#   UPSTREAM_TARGETING_URL   the supplier's targeting-options endpoint (https). Not recorded
#                            in the repo on purpose, and NOT verified from here.
#   GEONODE_API_KEY          already set for deploy.yml (passed below as UPSTREAM_API_KEY).
#
# Must live at .github/workflows/ at the repo root, not inside gp/.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gp
    env:
      UPSTREAM_TARGETING_URL: ${{ secrets.UPSTREAM_TARGETING_URL }}
      UPSTREAM_API_KEY: ${{ secrets.GEONODE_API_KEY }}
    steps:
      - name: Skip when not configured
        id: gate
        run: |
          if [ -z "$UPSTREAM_TARGETING_URL" ] || [ -z "$UPSTREAM_API_KEY" ]; then
            echo "::notice::UPSTREAM_TARGETING_URL / the API key are not set as repository secrets — nothing to check."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
      - name: Pull the export and regenerate
        if: steps.gate.outputs.run == 'true'
        run: |
          node scripts/pull-targeting.mjs
          python3 scripts/generate-geo-data.py
          python3 scripts/generate-asn-data.py
          python3 scripts/generate-locations.py
      - name: Fail when the committed data is out of date
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -n "$(git status --porcelain -- public/geo lib/geo lib/locations)" ]; then
            git status --short -- public/geo lib/geo lib/locations | head -50
            echo "::error::The supplier's targeting data has changed. On a machine with the export: npm run pull:targeting, run the three scripts/generate-*.py scripts from gp/, review the diff and commit it."
            exit 1
          fi
          echo "Targeting data is up to date."
