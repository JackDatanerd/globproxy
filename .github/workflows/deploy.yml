name: Deploy to Cloudflare Workers

# Closes two real incidents in one file:
#
# 1. Manual `wrangler deploy` from a local machine has, more than once, left
#    the Worker's secrets missing entirely (this app, and previously POA
#    Defender). This workflow is the only path that sets secrets on every
#    single deploy via the `secrets:` input below — they can't silently go
#    stale or get skipped because a human ran the wrong command.
#
# 2. NEXT_PUBLIC_* values are baked into the client-side JS bundle at BUILD
#    time, not read at Worker runtime — `wrangler secret put` alone does
#    NOT fix a browser-side "Supabase client requires URL and key" error,
#    because it doesn't touch whatever bundle was already built. This
#    workflow explicitly exports them as env vars for the build step (job
#    below), so every deploy rebuilds the client bundle with real values,
#    not just refreshes server-side secrets.
#
# Also: this runs on ubuntu-latest, which sidesteps the Windows/miniflare
# access-violation crash (`opennextjs-cloudflare` is explicitly documented
# as unreliable on native Windows — WSL is the workaround locally, but CI
# on Linux avoids the problem entirely).
#
# Must live at .github/workflows/ at the repo root, not inside gp/ — same
# as the cron workflows.

on:
  push:
    branches: [main]
    paths:
      - 'gp/**'
  workflow_dispatch:
    inputs:
      skip_migration_gate:
        description: 'Emergency only: deploy even if the live database is missing migrations'
        type: boolean
        default: false

# The jobs below only read the repo; every secret they use is passed explicitly per
# step. Without this block the GITHUB_TOKEN gets the repository's default
# permissions, which may be read-write.
permissions:
  contents: read

# Two overlapping pushes used to run two deploys at once, and whichever
# finished last won regardless of commit order. Serialise them, and never
# cancel one mid-deploy (a half-applied wrangler deploy is worse than a wait).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Gates the deploy job below via `needs:` — this is what actually stops
  # a schema-drifted push from reaching production, not the separate
  # schema-drift-check.yml workflow (that one runs independently, with no
  # ordering guarantee against this file, so its failure alone never
  # blocked anything). Duplicating the check here, in the same workflow
  # run as the deploy it gates, is what makes it structural instead of a
  # step someone has to remember to wire up in repo settings.
  check-schema:
    runs-on: ubuntu-latest
    # No job may run for the 6-hour default: deploys are serialised through the
    # concurrency group below, so one hung step would block every later deploy.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gp/package-lock.json
      # Everything ci.yml runs on a pull request, here too: a push straight to main (no PR)
      # used to reach production having only had the two cheap checks below. `npm run check`
      # = schema.sql roll-up, cron / rate-limit wiring, API docs, supplier-name ratchet,
      # unit tests and the TypeScript check. The deploy job is `needs:`-gated on this.
      - run: npm ci
      - name: Checks (schema, cron wiring, API docs, supplier ratchet, tests, types)
        run: npm run check

  deploy:
    needs: check-schema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Code that calls an RPC or column from a migration must not go live before
      # that migration has been applied (0022 once sat unapplied in production while
      # every other check was green). Reads public.schema_migrations from the live
      # database and fails the deploy if any migration on disk is not recorded.
      # Apply the migration first (Supabase SQL editor), then push. For a genuine
      # emergency, run the workflow by hand with `skip_migration_gate` ticked.
      - name: Check the live database has every migration applied
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_migration_gate) }}
        run: node scripts/check-migrations-applied.mjs
        timeout-minutes: 5
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build (Next.js + OpenNext Cloudflare adapter)
        run: npm run build:cf
        env:
          # These three get inlined into the client-side bundle right here —
          # this is the step that matters for fixing "URL and key are
          # required" in the browser console. Setting them only as Worker
          # secrets later (below) does NOT retroactively fix this build's
          # output.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          # Turnstile's PUBLIC site key is baked into the client bundle at
          # build time exactly like the three above. Leaving it out of this
          # block meant the widget could never render, whatever was set on the
          # Worker. Optional: empty/unset simply leaves Turnstile off.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          # 'enforce' turns the Content-Security-Policy-Report-Only header into an
          # enforcing Content-Security-Policy (next.config.ts). Unset = report-only.
          CSP_MODE: ${{ vars.CSP_MODE }}
          # Promotes ONLY the signed-in nonce policy (dashboard/reseller/admin/invoice). Unset = follows CSP_MODE.
          CSP_MODE_PROTECTED: ${{ vars.CSP_MODE_PROTECTED }}

      # The version that is live BEFORE this run changes anything. The smoke
      # test below rolls back to exactly this id. A bare `wrangler rollback`
      # goes back one version, and every `wrangler secret put` in the optional
      # secrets step creates a new version of the NEW code - so "one version
      # back" was the same broken build, minus a secret, and the rollback did
      # nothing.
      - name: Record the currently live version
        working-directory: gp
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          prev=$(npx wrangler deployments list --json 2>/dev/null | node -e '
            let t = ""; process.stdin.on("data", d => t += d).on("end", () => {
              try {
                const list = JSON.parse(t).filter(d => d && Array.isArray(d.versions) && d.versions.length)
                list.sort((a, b) => String(a.created_on).localeCompare(String(b.created_on)))
                const last = list[list.length - 1]
                const v = last && [...last.versions].sort((a, b) => (b.percentage || 0) - (a.percentage || 0))[0]
                process.stdout.write(v && v.version_id ? v.version_id : "")
              } catch { process.stdout.write("") }
            })') || prev=""
          if [ -n "$prev" ]; then
            echo "PREVIOUS_VERSION_ID=$prev" >> "$GITHUB_ENV"
            echo "Live version before this deploy: $prev"
          else
            echo "::warning::Could not read the live version before deploying (first deploy, or the API call failed) - an automatic rollback will have no target and must be done by hand."
          fi

      - name: Deploy to Cloudflare Workers
        timeout-minutes: 15
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gp
          command: deploy
          # Every name listed here gets pushed to the Worker via
          # `wrangler secret put` as part of this same run, using the
          # matching value from the env block below. This is what makes
          # secrets a guarantee on every deploy instead of a one-time
          # manual step someone has to remember.
          secrets: |
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
            GEONODE_API_KEY
            GEONODE_RESELLER_ID
            PAYSTACK_SECRET_KEY
            RESEND_API_KEY
            CRON_SECRET
            NEXT_PUBLIC_APP_URL
            ADMIN_EMAIL
            FROM_EMAIL
            STOCK_ALERT_THRESHOLD
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEONODE_API_KEY: ${{ secrets.GEONODE_API_KEY }}
          GEONODE_RESELLER_ID: ${{ secrets.GEONODE_RESELLER_ID }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          STOCK_ALERT_THRESHOLD: ${{ secrets.STOCK_ALERT_THRESHOLD }}

      # Optional Worker secrets. They are NOT in the `secrets:` list above on
      # purpose: that list needs every entry to have a value, so adding an
      # optional one there would fail every deploy until it was set. This step
      # pushes each one only when it has a value in GitHub, and leaves the
      # Worker's existing value alone when it doesn't — so it can never wipe a
      # key someone set by hand in the Cloudflare dashboard.
      #
      #   TURNSTILE_SECRET_KEY        bot check on login / signup / reset. Pair
      #                               it with the NEXT_PUBLIC_TURNSTILE_SITE_KEY
      #                               build variable above (the server ignores
      #                               the secret when the site key is missing).
      #   MFA_ENCRYPTION_KEY          encrypts TOTP secrets + keys backup-code
      #                               hashes. Without it they are stored in
      #                               plaintext / unkeyed (lib/mfaCrypto.ts).
      #   MFA_ENCRYPTION_KEY_PREVIOUS only during a key rotation.
      #   INVOICE_SELLER_NAME / _ADDRESS / _TAX_ID  printed on every invoice. Unset,
      #                               invoices fall back to a default seller name and
      #                               omit the address and tax id.
      #   SUPABASE_CAPTCHA_ENABLED    set to `true` only together with the Supabase
      #                               dashboard's CAPTCHA toggle (lib/turnstile.ts):
      #                               one without the other breaks sign-in.
      #   REFERRAL_IP_SALT            salt for the hashed IPs kept for referral
      #                               fraud checks (falls back to CRON_SECRET).
      #   PASSWORD_BREACH_CHECK       `off` disables the breached-password lookup.
      #   HEARTBEAT_URL               https URL an external monitor expects a GET from every
      #                               5 minutes (the Worker pings it after a fully OK */5 chain).
      #   UPSTREAM_COST_PER_GB_USD    what a GB costs us wholesale, for the profit figures on
      #                               /admin and /admin/cycles. Kept out of the source on
      #                               purpose; unset, those pages say "not set" instead of
      #                               showing a cost of $0.
      #
      # CAUTION: setting MFA_ENCRYPTION_KEY here to a value DIFFERENT from the
      # one already live makes existing encrypted TOTP secrets undecryptable
      # unless the old value is supplied as MFA_ENCRYPTION_KEY_PREVIOUS in the
      # same deploy.
      - name: Push optional Worker secrets
        working-directory: gp
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
          MFA_ENCRYPTION_KEY_PREVIOUS: ${{ secrets.MFA_ENCRYPTION_KEY_PREVIOUS }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          INVOICE_SELLER_NAME: ${{ secrets.INVOICE_SELLER_NAME }}
          INVOICE_SELLER_ADDRESS: ${{ secrets.INVOICE_SELLER_ADDRESS }}
          INVOICE_SELLER_TAX_ID: ${{ secrets.INVOICE_SELLER_TAX_ID }}
          SUPABASE_CAPTCHA_ENABLED: ${{ secrets.SUPABASE_CAPTCHA_ENABLED }}
          REFERRAL_IP_SALT: ${{ secrets.REFERRAL_IP_SALT }}
          PASSWORD_BREACH_CHECK: ${{ secrets.PASSWORD_BREACH_CHECK }}
          UPSTREAM_COST_PER_GB_USD: ${{ secrets.UPSTREAM_COST_PER_GB_USD }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          names="TURNSTILE_SECRET_KEY MFA_ENCRYPTION_KEY MFA_ENCRYPTION_KEY_PREVIOUS INVOICE_SELLER_NAME INVOICE_SELLER_ADDRESS INVOICE_SELLER_TAX_ID SUPABASE_CAPTCHA_ENABLED REFERRAL_IP_SALT PASSWORD_BREACH_CHECK UPSTREAM_COST_PER_GB_USD HEARTBEAT_URL"
          for name in $names; do
            [ -z "${!name}" ] && echo "::notice::$name is not set in GitHub secrets — leaving the Worker's current value untouched"
          done
          # ONE `wrangler secret bulk` call, not one `secret put` per name. Every `put`
          # creates and immediately deploys a new Worker version, so during a key
          # rotation MFA_ENCRYPTION_KEY was live for a few seconds WITHOUT
          # MFA_ENCRYPTION_KEY_PREVIOUS — every stored TOTP secret undecryptable, which
          # locks out step-up (including account deletion). One call = one version.
          payload=$(node -e '
            const out = {}
            for (const n of process.argv.slice(1)) if (process.env[n]) out[n] = process.env[n]
            process.stdout.write(JSON.stringify(out))
          ' $names)
          if [ "$payload" != "{}" ]; then
            printf '%s' "$payload" | npx wrangler secret bulk
          fi
          if [ -z "$MFA_ENCRYPTION_KEY" ]; then
            echo "::warning::MFA_ENCRYPTION_KEY is not set in GitHub secrets. If it is not set on the Worker either, TOTP secrets are stored in plaintext. Generate one with: openssl rand -base64 32"
          fi
          if [ -n "$TURNSTILE_SECRET_KEY" ] && [ -z "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" ]; then
            echo "::warning::TURNSTILE_SECRET_KEY is set but NEXT_PUBLIC_TURNSTILE_SITE_KEY is not — the widget cannot render, so the server will ignore Turnstile until both are set."
          fi

      # Post-deploy smoke test. The deploy above is live to everyone the moment
      # wrangler finishes, so a build that cannot reach the database, lacks a
      # required setting or binding, or cannot render a page used to stay live
      # until someone noticed. This calls /api/health AND two real pages (the
      # middleware does not run on /api, so health alone cannot see a broken
      # middleware or page render) and, if the NEW version reports itself
      # broken, rolls the Worker back to the version recorded before the deploy
      # and fails the run.
      #
      # It rolls back only on evidence the app itself is broken - an HTTP 5xx (our
      # own 503 "degraded", or a Worker error). Anything else that is not a 200
      # (a Cloudflare challenge page, a 403/429, a network blip, a 404) is reported
      # as a warning and left alone: rolling back because a bot-protection rule
      # blocked the CI runner would undo every deploy.
      - name: Smoke test (roll back on a broken deploy)
        working-directory: gp
        timeout-minutes: 12
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          base="${APP_URL%/}"
          worst=200
          check() { # $1 = path, $2 = output file, $3 = send secret header (1/0)
            local code=000 i
            for i in 1 2 3 4 5 6; do
              if [ "$3" = "1" ]; then
                code=$(curl -s -o "$2" -w '%{http_code}' --max-time 20 -H "x-cron-secret: $CRON_SECRET" "$base$1" || true)
              else
                code=$(curl -s -o "$2" -w '%{http_code}' --max-time 20 "$base$1" || true)
              fi
              [ "$code" = "200" ] && break
              echo "$1 attempt $i: HTTP $code" >&2
              [ "$3" = "1" ] && { cat "$2" 2>/dev/null >&2; echo >&2; }
              sleep 10
            done
            echo "$code"
          }
          health=$(check /api/health /tmp/health.json 1)
          home=$(check / /tmp/home.html 0)
          login=$(check /auth/login /tmp/login.html 0)
          echo "health=$health home=$home login=$login"
          [ "$health" = "200" ] && { echo "Health check passed:"; cat /tmp/health.json; echo; }

          # Surface recommended-but-unset settings without failing the deploy.
          if [ -s /tmp/health.json ]; then
            node -e '
              try {
                const b = JSON.parse(require("fs").readFileSync("/tmp/health.json", "utf8"))
                if (Array.isArray(b.warnings) && b.warnings.length) console.log("::warning::Recommended settings are not set: " + b.warnings.join(", "))
                if (Array.isArray(b.missing_limiters) && b.missing_limiters.length) console.log("::error::Rate limiters missing from the Worker: " + b.missing_limiters.join(", "))
              } catch {}
            '
          fi

          broken=""
          for c in "$health" "$home" "$login"; do
            [[ "$c" =~ ^5 ]] && broken="$c"
          done
          # Not one of the three answered at all (000 = no HTTP response after every retry): the
          # domain is not reaching the Worker. That is what losing the Custom Domain (or turning
          # the workers.dev route off with nothing else serving it) looks like, and it is not a
          # bot-protection page or a blip — those still answer. Roll back.
          if [ -z "$broken" ] && [ "$health" = "000" ] && [ "$home" = "000" ] && [ "$login" = "000" ]; then
            broken="000 (no response from $base)"
          fi
          if [ -n "$broken" ]; then
            echo "::error::The new version is unhealthy (HTTP $broken) - rolling back"
            if [ -n "$PREVIOUS_VERSION_ID" ]; then
              npx wrangler rollback "$PREVIOUS_VERSION_ID" --message "auto-rollback: post-deploy smoke test failed (HTTP $broken)" -y \
                || echo "::error::Rollback itself failed - roll back manually in the Cloudflare dashboard"
            else
              echo "::error::No previous version was recorded, so there is nothing safe to roll back to automatically - roll back manually in the Cloudflare dashboard"
            fi
            exit 1
          elif [ "$health" != "200" ] || [ "$home" != "200" ] || [ "$login" != "200" ]; then
            echo "::warning::Smoke test did not get 200 everywhere (health=$health home=$home login=$login) and none was a server error - NOT rolling back. Check $base by hand."
          fi

      - name: Notify IndexNow (Bing/Yandex) of current sitemap
        # Runs only after the deploy step above succeeds (default sequential
        # step behavior — this step is simply never reached if deploy fails).
        # continue-on-error is intentional: this pings an external API
        # that's aggregate/non-critical, not part of the app itself — a
        # transient IndexNow outage on their end shouldn't mark an otherwise
        # successful deploy as a failed CI run and page anyone. The step
        # still logs its own pass/fail in the Actions run either way.
        # Only pages whose sitemap <lastmod> changed recently are sent (scripts/indexnow-submit.mjs);
        # `npm run indexnow -- --all` re-sends everything by hand.
        run: npm run indexnow
        continue-on-error: true
        # continue-on-error does not stop a HANG: the step used to run up to the job
        # limit and hold the deploy queue. The script also times out its own requests.
        timeout-minutes: 5
