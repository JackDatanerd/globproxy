name: Cron — Usage Sync (every 5 min)

# This is the job that was missing entirely — nothing has ever called
# /api/cron/usage on a schedule, which is very likely why customers' gb_used
# never moved despite real bandwidth use.
#
# Runs every 5 min (tightened from an initial 15) because this is now the
# ONLY thing that deducts bandwidth — usage-based model, no upfront deduction
# at credential creation. Staleness here directly equals how far a customer
# could theoretically overdraw before the system catches up.
#
# One-time setup:
#   1. wrangler secret put CRON_SECRET        (pick any long random string)
#   2. GitHub repo Settings → Secrets and variables → Actions, add:
#        CRON_SECRET = same value as above
#        APP_URL     = https://globproxy.com   (no trailing slash)
#
# IMPORTANT: this file must live at .github/workflows/ at the REPO ROOT
# (the folder containing both .git and gp/), not inside gp/.github/workflows/
# — GitHub Actions only discovers workflows at the true repo root. That
# misplacement is why this never showed up in the Actions tab before.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  usage-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call usage sync endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.APP_URL }}/api/cron/usage" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response body: $body"
          echo "HTTP status: $http_code"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Cron usage-sync failed with HTTP $http_code — see response body above for the actual error message"
            exit 1
          fi
