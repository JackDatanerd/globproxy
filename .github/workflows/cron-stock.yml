name: Cron — Stock Check (hourly)

# Same secrets as cron-usage.yml — CRON_SECRET and APP_URL.
# Must live at .github/workflows/ at the repo root, not inside gp/.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  stock-check:
    runs-on: ubuntu-latest
    steps:
      - name: Call stock check endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.APP_URL }}/api/cron/stock" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response body: $body"
          echo "HTTP status: $http_code"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Cron stock-check failed with HTTP $http_code — see response body above"
            exit 1
          fi
